; RoboRumble patch settings. Lives in the game's DATA folder next to winmm.dll.

[general]
; writes rrpatch.log next to this file
log=1
; skip the "There are other tasks running in the background" box at startup
skip_task_warning=1
; 1 = log every data file the game opens (for finding which sound/texture is used when)
log_files=0
; 1 = log DirectSound activity (Play/Stop/volume per buffer) to find audio glitches
log_sound=0
; 1 = Glide renderer: window title shows fps, slowest frame and time waiting in the swap
show_fps=0
; 1 = sampling profiler for the game thread, logs where frame time goes every 5 s
profile=0

[window]
; Windowed mode.
; Software renderer (rr_soft.exe): the patch draws the game into a window itself.
; Glide renderer (rr_glide.exe) on nGlide (GOG): nGlide's display mode change and fullscreen
;   device are turned off, so it renders into the patch's window from the start.
; Glide or Direct3D on dgVoodoo2 (dgVoodoo.conf in DATA): dgVoodoo renders windowed.
; Direct3D renderer (rr_dx5.exe) without dgVoodoo: not supported.
enabled=1
; Glide on nGlide: keep nGlide windowed (no display mode change, no fullscreen at start).
; 0 = nGlide's own fullscreen; then glide_auto_windowed=1 presses Alt+Enter for it.
glide_no_mode_switch=1
glide_auto_windowed=1
; Glide: 1 = run at the game's own pace (~45 fps). 2 = what the game asks for: a swap every
; second refresh, which caps it at 30 fps and slows the game down. 0 = no vsync.
glide_swap_interval=1
; menus and briefing at 60 fps instead of the game's 45
menu_fps60=1
; Glide on nGlide: decode the game's YIQ (NCC) textures once in the patch instead of letting
; nGlide decode them again on every texture switch (zoomed out: 15-25 fps -> 60 fps)
glide_ncc_cache=1
; 1 = borderless window covering the screen. Alt+Enter toggles while playing.
borderless=0
; window size = 640x480 times this (shrinks to fit the screen)
scale=2
; 1 = smooth scaling, 0 = sharp pixels
smooth=0
; the game expects vsync; 0 = uncapped
fps_limit=60
; keep the mouse inside the game during missions (needed for edge scrolling); menus and the
; briefing leave it free so the window can be moved. 2 = also in menus, 0 = never
clip_cursor=1
; 1 = the game keeps running when another window is in front (it normally pauses);
; handy when streaming or chatting next to it
keep_running_in_background=1
; mouse wheel zooms (wheel up = in); wheel_ms = how long one notch zooms
wheel_zoom=1
wheel_ms=120

[input]
; Mission mouse controls. 1 = RTS style: left click / drag selects as before, left click on
; empty ground deselects, right click moves or attacks. 0 = the game's own: left click on the
; ground moves, right click deselects.
right_click_commands=1
; hold the right button and move the mouse to pan the camera (needs right_click_commands=1)
right_drag_pan=1
; pan speed; pan_grab=1 drags the map (camera moves against the mouse), 0 = camera follows the mouse
pan_speed=1.0
pan_grab=1
; W A S D scroll the camera like the arrow keys during missions. The game's own keys still
; work with Shift held (Shift+S shadows, Shift+D screenshot).
wasd_camera=1
; the ` key (left of 1) changes the game speed during missions: 1x, 1.5x, 2x
speed_key=1

[music]
; Plays the CD soundtrack from Ogg files: <folder>\Track02.ogg ... Track09.ogg
; (the GOG release ships them in DATA\MUSIC).
enabled=1
folder=MUSIC
; 0-100, on top of the in-game music volume
volume=100

[files]
; Files in DATA\<override_folder>\ replace the same file inside the .pak archives,
; e.g. override\maps\b-12\b-12.map
enabled=1
override_folder=override

[adjust]
; Values merged into adjust.ini at startup. Delete a line to get the game's default back.
; Camera from the "Better Zoom and Bug Fixes" mod (Hommelwomb): zoom out much further,
; top-down view. Originals: max_zoom=1000, min_zoom=2000, camera_z=-1484.333374,
; camera_view_angle=-35, zoom_speed=50, rotate_speed=50, scroll_speed=55
max_zoom=3000.000000
min_zoom=12000.000000
camera_z=-5000.000000
camera_view_angle=0
zoom_speed=99
rotate_speed=25
scroll_speed=25
; How fast sounds fade with camera distance (original 1.2); the mod lowers it so robots
; stay audible when zoomed out
sound_attenuation=0.070000

[sfx]
; Fixes sound effects that were recorded with clipping (door, rocket launcher, nuke, ...):
; clipped peaks are rebuilt, the level is lowered just enough for them, and sounds that
; start or end abruptly get a 3 ms fade. Fixed copies are written to rrpatch_gen\.
auto_fix=1

[sfx_trim]
; Milliseconds to silence at the start of an effect (faded back in over 5 ms).
; door.wav opens with a harsh metal scrape before the slam (the crack when the
; LEVEL doors close); this mutes it.
wav\door.wav=40

[sfx_gain]
; Extra volume change in dB per effect, on top of the fixes, e.g.
; wav\door.wav=-3
[dev]
; 1 = open the developer window next to the game (win/lose missions, unlocks, money,
; console commands, live adjust.ini values)
enabled=0

[ap]
; 1 = connect to the RoboRumble Archipelago client (apworld/roborumble) on 127.0.0.1:port
enabled=0
port=38480
